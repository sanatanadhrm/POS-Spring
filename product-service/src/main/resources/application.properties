spring.application.name=cashier
server.port=8082
spring.config.import=classpath:secret.properties


logging.level.org.flywaydb=INFO
spring.flyway.enabled=true

spring.jpa.hibernate.ddl-auto=validate


# Jumlah request terakhir yang dipantau (sample window)
resilience4j.circuitbreaker.instances.authService.sliding-window-size=10
# Minimal request masuk sebelum mulai menghitung persentase kegagalan
resilience4j.circuitbreaker.instances.authService.minimum-number-of-calls=5
# Ambang batas kegagalan (jika 50% request gagal, sirkuit langsung OPEN)
resilience4j.circuitbreaker.instances.authService.failure-rate-threshold=50
# Berapa lama sirkuit tetap OPEN sebelum mencoba HALF-OPEN (10.000 ms = 10 detik)
resilience4j.circuitbreaker.instances.authService.wait-duration-in-open-state=10000
# Jumlah request percobaan saat kondisi HALF-OPEN
resilience4j.circuitbreaker.instances.authService.permitted-number-of-calls-in-half-open-state=3
# Daftarkan exception yang dihitung sebagai kegagalan (misal timeout atau 5xx)
resilience4j.circuitbreaker.instances.authService.record-exceptions[0]=java.lang.Exception
# Kecualikan 4xx (karena 400/404 bukan kesalahan service down, melainkan salah input klien)
resilience4j.circuitbreaker.instances.authService.ignore-exceptions[0]=com.example.cashier.commons.exception.BadRequestException
resilience4j.circuitbreaker.instances.authService.ignore-exceptions[1]=com.example.cashier.commons.exception.NotFoundException

# Menampilkan [CID:xxxx] di setiap baris log (atau [CID:NONE] jika saat booting aplikasi)
logging.pattern.level=%5p [CID:%X{correlationId:-NONE}]

# ==========================================
# Actuator & Prometheus Configuration
# ==========================================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=product-service