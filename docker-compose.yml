networks:
  cashier-net:
    driver: bridge

volumes:
  pg_data:
  rabbitmq_data:
  redis_data:
  grafana_data:
  tempo_data:

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    ports:
      - "5432:5432"
    networks:
      - cashier-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq-broker:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-broker
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - cashier-net
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - cashier-net
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-monitoring-cashier
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - cashier-net
    depends_on:
      - auth-cashier-service
      - product-cashier-service
      - order-cashier-service

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3005
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: ${GRAFANA_USERS_ALLOW_SIGN_UP}
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3005:3000"
    networks:
      - cashier-net
    depends_on:
      - prometheus
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
      - "4318:4318"
    networks:
      - cashier-net
    depends_on:
      - grafana

  auth-cashier-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-cashier-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL_AUTH}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_RAHASIA_JWT_SECRET: ${JWT_SECRET}
      APP_RAHASIA_ACCESS_TOKEN_EXPIRED_DURATION: ${JWT_ACCESS_TOKEN_EXPIRATION_DURATION}
      APP_RAHASIA_REFRESH_TOKEN_EXPIRED_DURATION: ${JWT_REFRESH_TOKEN_EXPIRATION_DURATION}
    networks:
      - cashier-net
    depends_on:
      postgres-db:
        condition: service_healthy

  product-cashier-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-cashier-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL_PRODUCT}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_RAHASIA_JWT_SECRET: ${JWT_SECRET}
      APP_RAHASIA_ACCESS_TOKEN_EXPIRED_DURATION: ${JWT_ACCESS_TOKEN_EXPIRATION_DURATION}
      APP_RAHASIA_REFRESH_TOKEN_EXPIRED_DURATION: ${JWT_REFRESH_TOKEN_EXPIRATION_DURATION}
      APP_RAHASIA_AUTH_SERVICE_URL: http://auth-cashier-service:8081/api/v1
    networks:
      - cashier-net
    depends_on:
      postgres-db:
        condition: service_healthy

  order-cashier-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-cashier-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL_ORDER}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_RAHASIA_JWT_SECRET: ${JWT_SECRET}
      APP_RAHASIA_ACCESS_TOKEN_EXPIRED_DURATION: ${JWT_ACCESS_TOKEN_EXPIRATION_DURATION}
      APP_RAHASIA_REFRESH_TOKEN_EXPIRED_DURATION: ${JWT_REFRESH_TOKEN_EXPIRATION_DURATION}
      APP_RAHASIA_PRODUCT_SERVICE_URL: http://product-cashier-service:8082/api/v1
      APP_RAHASIA_AUTH_SERVICE_URL: http://auth-cashier-service:8081/api/v1
      SPRING_RABBITMQ_HOST: rabbitmq-broker
      SPRING_DATA_REDIS_HOST: redis-cache
    networks:
      - cashier-net
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq-broker:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
