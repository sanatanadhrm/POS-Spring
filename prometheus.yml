global:
  scrape_interval: 5s     # Sedot metrik setiap 5 detik sekali
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-cashier-service:8081']
        labels:
          application: 'auth-service'

  - job_name: 'product-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['product-cashier-service:8082']
        labels:
          application: 'product-service'

  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['order-cashier-service:8083']
        labels:
          application: 'order-service'