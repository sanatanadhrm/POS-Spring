spring.application.name=auth-service
spring.config.import=classpath:secret.properties
server.port=8081

logging.level.org.flywaydb=INFO
spring.flyway.enabled=true

spring.jpa.hibernate.ddl-auto=validate

# Menampilkan [CID:xxxx,traceId=...,spanId=...] di setiap baris log
logging.pattern.level=%5p [CID:%X{correlationId:-NONE},traceId=%X{traceId:-NONE},spanId=%X{spanId:-NONE}]

# ==========================================
# Actuator & Prometheus Configuration
# ==========================================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# ==========================================
# OpenTelemetry Tracing to Tempo
# ==========================================
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${TEMPO_ENDPOINT:http://tempo:4318/v1/traces}
management.otlp.metrics.export.enabled=false
